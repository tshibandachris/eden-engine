name: Eden Engine CI

on:
  push:
    branches: ["main", "fix/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

concurrency:
  group: eden-engine-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Synchronize npm lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install locked dependencies
        run: npm ci
      - name: Run automated tests
        run: npm test -- --watchAll=false
        env:
          CI: true
      - name: Build application
        run: npm run build
      - name: Commit generated lockfile
        if: github.event_name == 'push' && github.ref != 'refs/heads/main' && hashFiles('package-lock.json') != ''
        run: |
          if [ -n "$(git status --porcelain -- package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(deps): add reproducible npm lockfile"
            git push
          fi
